# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "面试蛙接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.yupi.mianshiya.controller
# AI 大模型接入（目前是火山引擎 DeepSeek）
ai:
  apiKey: ${AI_API_KEY:xxx}
  service:
    # 默认关闭；开启后会创建 AI Feign 客户端，并检查内部凭证是否存在。
    enabled: ${AI_SERVICE_ENABLED:false}
    # 双方共享的内部凭证，通过私有配置/环境变量提供，不传给浏览器。
    token: ${AI_SERVICE_TOKEN:}
    # 必须与 Python 在 Nacos 注册的服务名一致。
    name: ${AI_SERVICE_NAME:mianshiya-ai-service}
    # 探测接口的连接/读取超时，单位毫秒；未来模型接口需另设更合适的预算。
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    # 真实生成等待预算；须大于 Python OPENAI_TIMEOUT_SECONDS 对应的毫秒数。
    model-read-timeout-ms: 40000
    # 面试 HTTP 转发已有独立长轮询预算；超时不代表后台任务已停止。
    wenjing-read-timeout-ms: 130000
    protection:
      enabled: ${AI_SERVICE_PROTECTION_ENABLED:true}
      # 单实例并发上限，按操作隔离；起始值不是容量承诺。
      poll-concurrency: 32
      read-concurrency: 16
      write-concurrency: 8
      setup-concurrency: 4
      # 10 秒至少 20 个完成请求、异常比例超过 50% 后熔断 10 秒。
      error-ratio: 0.5
      min-requests: 20
      stat-interval-ms: 10000
      open-seconds: 10
feign:
  # 本次使用默认 HTTP 客户端；AI 专属凭证/超时/重试配置见 AiClientConfiguration。
  httpclient:
    enabled: false
  okhttp:
    enabled: false
  sentinel:
    # 本次 AI 探测尚未设计 Feign 的 Sentinel 熔断；原业务 Sentinel 规则仍按原方式运行。
    enabled: false
